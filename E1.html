<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vokabeltrainer - Vokabelliste</title>
    <style>
        :root {
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --secondary-color: #64748b;
            --secondary-hover: #475569;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            color: #0f172a;
        }

        .counter {
            font-size: 0.95rem;
            color: var(--secondary-color);
            margin-bottom: 25px;
            background-color: #e2e8f0;
            padding: 4px 12px;
            border-radius: 20px;
        }

        /* Flashcard Styling */
        .flashcard-container {
            perspective: 1000px;
            width: 380px;
            height: 240px;
            cursor: pointer;
            margin-bottom: 15px;
        }

        .card {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border-radius: 16px;
            background-color: var(--card-bg);
        }

        .card.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
        }

        .card-front {
            background-color: var(--card-bg);
            color: var(--text-color);
        }

        .card-back {
            background-color: #f8fafc;
            color: var(--text-color);
            transform: rotateY(180deg);
        }

        .card-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--secondary-color);
            margin-bottom: 12px;
        }

        .card-text {
            font-size: 1.3rem;
            font-weight: 600;
            line-height: 1.4;
        }

        .hint {
            font-size: 0.85rem;
            color: var(--secondary-color);
            margin-bottom: 25px;
        }

        /* Controls / Buttons */
        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 10px;
        }

        button {
            padding: 10px 18px;
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            color: white;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background-color: var(--secondary-color);
        }

        .btn-secondary:hover {
            background-color: var(--secondary-hover);
        }

        .btn-primary {
            background-color: var(--primary-color);
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>

    <h1>Vokabeltrainer</h1>
    <div class="counter" id="cardCounter">Karte 1 von 37</div>

    <div class="flashcard-container" onclick="flipCard()">
        <div class="card" id="flashcard">
            <!-- Vorderseite (Englisch) -->
            <div class="card-face card-front">
                <div class="card-label">Englisch (Vorderseite)</div>
                <div class="card-text" id="frontText">a flat</div>
            </div>
            <!-- Rückseite (Deutsch) -->
            <div class="card-face card-back">
                <div class="card-label">Deutsch (Rückseite)</div>
                <div class="card-text" id="backText">eine Wohnung</div>
            </div>
        </div>
    </div>

    <div class="hint">Klicke auf die Karte oder 'Umdrehen' zum Wenden</div>

    <div class="controls">
        <button class="btn-secondary" onclick="prevCard()">← Zurück</button>
        <button class="btn-primary" onclick="flipCard()">🔄 Umdrehen</button>
        <button class="btn-primary" onclick="nextCard()">Weiter / Skip →</button>
    </div>
    <div class="controls">
        <button class="btn-secondary" onclick="shuffleCards()">🔀 Mischen</button>
    </div>

    <script>
        // Neue Vokabelliste (37 Vokabeln)
        const vocabData = [
            { front: "a flat", back: "eine Wohnung" },
            { front: "part-time job / full-time job", back: "Teilzeitjob / Vollzeitjob" },
            { front: "to be employed", back: "angestellt sein" },
            { front: "to be self-employed", back: "selbstständig sein" },
            { front: "main occupation", back: "Hauptberuf / Haupttätigkeit" },
            { front: "to set up a company", back: "eine Firma gründen" },
            { front: "to run a company", back: "eine Firma leiten / führen" },
            { front: "to join a business", back: "in ein Unternehmen einsteigen / einer Firma beitreten" },
            { front: "to do administrative work", back: "Verwaltungsarbeit leisten / administrative Arbeit erledigen" },
            { front: "a delivery", back: "eine Lieferung / Zustellung" },
            { front: "to deliver sth to sb", back: "jmdm. etw. liefern / zustellen" },
            { front: "a supply", back: "ein Vorrat / eine Lieferung / ein Bedarf" },
            { front: "to supply sb with sth", back: "jmdn. mit etw. versorgen / jmdm. etw. liefern" },
            { front: "rare (adj.)", back: "selten" },
            { front: "tight (adj.)", back: "eng / knapp" },
            { front: "appointment", back: "Termin" },
            { front: "retail", back: "Einzelhandel" },
            { front: "retail assistant manager", back: "stellvertretende/r Filialleiter/in, Einzelhandelskaufmann/-frau" },
            { front: "HR (human resources)", back: "Personalabteilung, Personalwesen" },
            { front: "HR assistant", back: "Personalsachbearbeiter/in" },
            { front: "customer adviser", back: "Kundenberater/in" },
            { front: "to order sth", back: "etw. bestellen" },
            { front: "to post sth", back: "etw. (im Internet / per Aushang) bekanntgeben" },
            { front: "to serve sb", back: "jdn. bedienen" },
            { front: "to transfer a call", back: "einen Anruf weiterleiten / durchstellen" },
            { front: "colleague", back: "Kollege/-in" },
            { front: "administrative", back: "administrativ, Verwaltung" },
            { front: "job opening", back: "freie / offene Stelle" },
            { front: "office supplies pl", back: "Büromaterial, Bürobedarf" },
            { front: "to display sth", back: "etw. (Ware usw.) präsentieren, etw. auslegen" },
            { front: "smooth(ly)", back: "reibungslos, glatt" },
            { front: "responsibility", back: "Aufgabe, Zuständigkeit" },
            { front: "applicant", back: "Bewerber/in" },
            { front: "hiring status", back: "Stand des Bewerbungsverfahrens" },
            { front: "job advert(isement)", back: "Stellenanzeige" },
            { front: "candidate", back: "Bewerber/in" }
        ];

        let currentIndex = 0;
        let isFlipped = false;

        const flashcard = document.getElementById('flashcard');
        const frontText = document.getElementById('frontText');
        const backText = document.getElementById('backText');
        const cardCounter = document.getElementById('cardCounter');

        function updateCardContent() {
            frontText.textContent = vocabData[currentIndex].front;
            backText.textContent = vocabData[currentIndex].back;
            cardCounter.textContent = `Karte ${currentIndex + 1} von ${vocabData.length}`;
        }

        function flipCard() {
            isFlipped = !isFlipped;
            if (isFlipped) {
                flashcard.classList.add('is-flipped');
            } else {
                flashcard.classList.remove('is-flipped');
            }
        }

        function nextCard() {
            if (isFlipped) {
                flipCard();
                setTimeout(() => {
                    currentIndex = (currentIndex + 1) % vocabData.length;
                    updateCardContent();
                }, 300);
            } else {
                currentIndex = (currentIndex + 1) % vocabData.length;
                updateCardContent();
            }
        }

        function prevCard() {
            if (isFlipped) {
                flipCard();
                setTimeout(() => {
                    currentIndex = (currentIndex - 1 + vocabData.length) % vocabData.length;
                    updateCardContent();
                }, 300);
            } else {
                currentIndex = (currentIndex - 1 + vocabData.length) % vocabData.length;
                updateCardContent();
            }
        }

        function shuffleCards() {
            if (isFlipped) {
                flipCard();
            }
            setTimeout(() => {
                for (let i = vocabData.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [vocabData[i], vocabData[j]] = [vocabData[j], vocabData[i]];
                }
                currentIndex = 0;
                updateCardContent();
            }, 300);
        }

        // Initiale Ansicht laden
        updateCardContent();
    </script>
</body>
</html>
