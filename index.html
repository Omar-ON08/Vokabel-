<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meine Linksammlung</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      /* Schöner Farbverlauf im Hintergrund */
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* Hauptcontainer (die weiße Karte) */
    .container {
      max-width: 1100px;
      width: 100%;
      background: white;
      border-radius: 2rem;
      padding: 2rem;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.4);
    }

    /* Kopfbereich */
    .kopf {
      text-align: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 3px solid #667eea;
    }

    .kopf h1 {
      font-size: 2rem;
      color: #333;
      margin-bottom: 0.3rem;
    }

    .kopf p {
      color: #666;
      font-size: 0.95rem;
    }

    /* Das Grid für die zwei Sprachen */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr; /* Zwei gleich große Spalten */
      gap: 2rem; /* Abstand zwischen den Spalten */
    }

    /* Spaltenüberschriften */
    .spalte h2 {
      font-size: 1.2rem;
      color: #555;
      margin-bottom: 1rem;
      padding-left: 0.5rem;
      border-left: 4px solid #764ba2;
    }

    /* Die Link-Karten */
    .link-folie {
      display: flex;
      align-items: center;
      background: #f8f9fa;
      margin-bottom: 0.8rem;
      padding: 1rem 1.2rem;
      border-radius: 1rem;
      text-decoration: none;
      color: #333;
      /* Blaue Balken auf beiden Seiten */
      border-left: 5px solid #667eea;
      border-right: 5px solid #667eea;
      transition: all 0.3s ease;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .link-folie:hover {
      transform: translateY(-3px) scale(1.02);
      background: #f0f2ff;
      border-left-color: #764ba2;
      border-right-color: #764ba2;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }

    /* Die Nummer im Kreis */
    .nummer {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 32px;
      height: 32px;
      background: #667eea;
      color: white;
      border-radius: 50%;
      font-weight: bold;
      font-size: 0.9rem;
      margin-right: 1rem;
      flex-shrink: 0;
      transition: background 0.3s;
    }

    .link-folie:hover .nummer {
      background: #764ba2;
    }

    /* Textbereich */
    .info {
      flex: 1;
    }

    .titel {
      font-weight: 600;
      font-size: 1rem;
      color: #222;
    }

    .beschreibung {
      font-size: 0.8rem;
      color: #777;
      margin-top: 0.2rem;
    }

    /* Icon (Link-Symbol) rechts */
    .zeichen {
      font-size: 1.2rem;
      margin-left: 1rem;
      opacity: 0.5;
      transition: opacity 0.3s;
    }

    .link-folie:hover .zeichen {
      opacity: 1;
    }

    /* Responsive: Auf kleinen Bildschirmen untereinander */
    @media (max-width: 700px) {
      .grid {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
      .container {
        padding: 1.2rem;
      }
      .kopf h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
