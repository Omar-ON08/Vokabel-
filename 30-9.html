<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deutsch-Persisch Lernkarten</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --card-back-bg: #18221b;
            --gold-accent: #d4af37;
            --gold-hover: #f1c40f;
            --persian-green: #2ecc71;
            --text-light: #e0e0e0;
            --text-muted: #a0a0a0;
            --border-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 540px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            color: var(--gold-accent);
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .card-counter {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Card Flip Container */
        .card-container {
            width: 100%;
            height: 600px;
            perspective: 1000px;
            cursor: pointer;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 16px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid var(--gold-accent);
            overflow-y: auto;
        }

        /* Scrollbar Styling */
        .card-face::-webkit-scrollbar {
            width: 6px;
        }
        .card-face::-webkit-scrollbar-thumb {
            background: var(--gold-accent);
            border-radius: 3px;
        }

        /* Front Styling */
        .card-front {
            background-color: var(--card-bg);
            color: var(--text-light);
        }

        /* Back Styling */
        .card-back {
            background-color: var(--card-back-bg);
            color: var(--persian-green);
            transform: rotateY(180deg);
            border-color: var(--persian-green);
            text-align: right;
            direction: rtl;
        }

        .type-badge {
            align-self: flex-start;
            background: rgba(212, 175, 55, 0.15);
            color: var(--gold-accent);
            border: 1px solid var(--gold-accent);
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-back .type-badge {
            align-self: flex-end;
            background: rgba(46, 204, 113, 0.15);
            color: var(--persian-green);
            border-color: var(--persian-green);
            direction: ltr;
        }

        /* Section 1: Wort */
        .word-section {
            margin-top: 8px;
            margin-bottom: 10px;
        }

        .word-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 2px;
        }

        .word-meta {
            font-size: 0.85rem;
            color: var(--gold-accent);
        }

        /* Simple Explanation Box */
        .simple-explanation {
            background: rgba(212, 175, 55, 0.1);
            border: 1px dashed var(--gold-accent);
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.82rem;
            margin-bottom: 10px;
            color: #efefef;
        }

        .simple-explanation strong {
            color: var(--gold-accent);
        }

        .usage-tag {
            display: inline-block;
            background: #333;
            color: #fff;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            margin-top: 4px;
        }

        /* Section 2: Beispielsätze */
        .sentence-section {
            background: rgba(255, 255, 255, 0.03);
            border-left: 3px solid var(--gold-accent);
            padding: 8px 10px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 10px;
        }

        .card-back .sentence-section {
            border-left: none;
            border-right: 3px solid var(--persian-green);
            border-radius: 8px 0 0 8px;
        }

        .sentence-label {
            font-size: 0.72rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 4px;
            display: block;
        }

        .sentence-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .sentence-list li {
            font-size: 0.85rem;
            line-height: 1.35;
            margin-bottom: 5px;
            position: relative;
            padding-left: 12px;
        }

        .sentence-list li:last-child {
            margin-bottom: 0;
        }

        .card-front .sentence-list li::before {
            content: "•";
            color: var(--gold-accent);
            position: absolute;
            left: 0;
            font-weight: bold;
        }

        .card-back .sentence-list li {
            padding-left: 0;
            padding-right: 12px;
            font-size: 0.95rem;
        }

        .card-back .sentence-list li::before {
            content: "•";
            color: var(--persian-green);
            position: absolute;
            right: 0;
            font-weight: bold;
        }

        /* Section 3: Formen / Konjugation */
        .details-section {
            background: rgba(0, 0, 0, 0.25);
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            margin-top: 5px;
        }

        .details-header {
            color: var(--gold-accent);
            font-size: 0.72rem;
            font-weight: bold;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        /* Back Content Details */
        .persian-word {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--persian-green);
            margin-top: 6px;
            margin-bottom: 6px;
            line-height: 1.2;
        }

        .flip-hint {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 6px;
        }

        /* Controls Navigation */
        .controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 15px;
            gap: 10px;
        }

        .btn {
            background-color: var(--card-bg);
            color: var(--gold-accent);
            border: 1px solid var(--gold-accent);
            padding: 12px 18px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            flex: 1;
            text-align: center;
            user-select: none;
        }

        .btn:hover {
            background-color: var(--gold-accent);
            color: #000;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-random.active {
            background-color: var(--gold-accent);
            color: #000;
        }

        @media (max-height: 700px) {
            .card-container {
                height: 520px;
            }
            .word-title {
                font-size: 1.3rem;
            }
        }
    </style>
</head>

    <div class="controls">

    </div>
</div>

const backWord = document.getElementById('backWord');
const backSentences = document.getElementById('backSentences');

const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const randomBtn = document.getElementById('randomBtn');

const faWordsMap = [
    "چیستان / معما", "حیرت / شگفتی", "شدت / قدرت", "خراب شده / ضایع شده", 
    "گیج / سردرگم", "فرار", "مردد / بدبین", "لحاظ کردن / در نظر گرفتن", 
    "جذب کردن / مکیدن", "مجوز / دسترسی", "پوشانده شده / مخفی", "قفسه ادویه", 
    "چانه", "می‌ترسم / بیم داشتن", "شایعه", "پرس‌وجو کردن", 
    "نشان دادن / محسوب شدن", "ایراد / اعتراض", "دقیق / با دقت", "در آینده / آینده", 
    "اثبات شده / امتحان‌پس‌داده", "عالی / فوق‌العاده", "متقاعدکننده", "دقیق", 
    "شهودی", "نیازمند بودن", "پشتکار / تلاش", "قصد داشتن", 
    "دائمی / ماندگار", "دایره واژگان", "ادغام کردن", "مداوم / پیوسته", 
    "تلاش کردن برای", "مانع / چالش", "پیچیدگی"
];

function renderCard(index) {
    const data = cardsData[index];
    
    // Reset Flip
    card.classList.remove('flipped');

    setTimeout(() => {
        typeBadge.textContent = data.type;
        frontWord.textContent = data.word;
        frontMeta.innerHTML = data.meta;

        // Simple Explanation box
        simpleExplanation.innerHTML = `<strong>Bedeutung:</strong> ${data.simple}<br><span class="usage-tag">${data.usage}</span>`;

        // Render 3 front sentences
        frontSentences.innerHTML = data.sentences.map(s => `<li>${s.de}</li>`).join('');

        // Render details
        if (data.details) {
            frontDetails.style.display = 'block';
            frontDetails.innerHTML = `<div class="details-header">Grammatik / Formen</div>` + data.details;
        } else {
            frontDetails.style.display = 'none';
        }

        // Set Persian word & sentences
        backWord.textContent = faWordsMap[index];
        backSentences.innerHTML = data.sentences.map(s => `<li>${s.fa}</li>`).join('');

        counterEl.textContent = `Karte ${index + 1} von ${cardsData.length}`;
    }, 150);
}

// Flip Action
cardContainer.addEventListener('click', () => {
    card.classList.toggle('flipped');
});

// Navigation
prevBtn.addEventListener('click', () => {
    if (isRandomMode) {
        currentIndex = Math.floor(Math.random() * cardsData.length);
    } else {
        currentIndex = (currentIndex - 1 + cardsData.length) % cardsData.length;
    }
    renderCard(currentIndex);
});

nextBtn.addEventListener('click', () => {
    if (isRandomMode) {
        currentIndex = Math.floor(Math.random() * cardsData.length);
    } else {
        currentIndex = (currentIndex + 1) % cardsData.length;
    }
    renderCard(currentIndex);
});

// Random Button Click
randomBtn.addEventListener('click', () => {
    let newIndex;
    do {
        newIndex = Math.floor(Math.random() * cardsData.length);
    } while (newIndex === currentIndex && cardsData.length > 1);
    currentIndex = newIndex;
    renderCard(currentIndex);
});

// Key Navigation
document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') nextBtn.click();
    if (e.key === 'ArrowLeft') prevBtn.click();
    if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        e.preventDefault();
        card.classList.toggle('flipped');
    }
});

// Init
renderCard(currentIndex);
</script>
